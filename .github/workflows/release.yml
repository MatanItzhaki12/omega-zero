name: release

# A release goes out for each version of omega-zero: on a push to main whose version in
# crates/omega-zero/Cargo.toml has no release yet, so bumping it is all a release takes, or on
# a pushed v* tag. A run by hand builds the tree without releasing it.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      release: ${{ steps.tag.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - name: Name the release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/omega-zero/Cargo.toml | head -1)"
          case "$GITHUB_REF" in
          refs/tags/*)
            tag="$GITHUB_REF_NAME"
            release=true
            ;;
          refs/heads/main)
            tag="v$version"
            # already out: a push that leaves the version as it was releases nothing
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              release=false
            else
              release=true
            fi
            ;;
          *)
            tag="v$version"
            release=false
            ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "omega-zero $version: $tag, release $release"

  checks:
    name: checks
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  build:
    name: card tree
    needs: [version, checks]
    # by hand the checks are skipped, and the tree is built all the same
    if: >-
      always() && !cancelled() && needs.checks.result != 'failure' &&
      (needs.version.outputs.release == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04-arm
    container: rust:1-bullseye
    outputs:
      zip: ${{ steps.package.outputs.zip }}
    steps:
      - uses: actions/checkout@v7

      - name: Check ScreenScraper's key
        env:
          OMEGA_SS_DEVID: ${{ secrets.OMEGA_SS_DEVID }}
          OMEGA_SS_DEVPASSWORD: ${{ secrets.OMEGA_SS_DEVPASSWORD }}
        run: |
          set -eu
          # A key ScreenScraper turns away would only show on a console, as Cart Labels saying
          # it refused this build. A fork may have no key of its own, so a missing one only
          # warns; a key ScreenScraper refuses stops the release. A ScreenScraper that cannot be
          # asked holds nothing up.
          if [ -z "$OMEGA_SS_DEVID" ] || [ -z "$OMEGA_SS_DEVPASSWORD" ]; then
            echo "::warning::No ScreenScraper key: Cart Labels will say it cannot reach ScreenScraper"
            exit 0
          fi
          reply="$RUNNER_TEMP/screenscraper-reply"
          rm -f "$reply"
          status=0
          # the softname label_sync.rs sends
          code="$(curl -s -m 30 --retry 2 -A omega-zero -o "$reply" -w '%{http_code}' -G \
            https://api.screenscraper.fr/api2/ssinfraInfos.php \
            --data-urlencode "devid=$OMEGA_SS_DEVID" \
            --data-urlencode "devpassword=$OMEGA_SS_DEVPASSWORD" \
            -d softname=omega-zero -d output=json)" || status=$?
          if [ "$code" = 403 ] || grep -qs 'Erreur de login' "$reply"; then
            echo "::error::ScreenScraper refused OMEGA_SS_DEVID and OMEGA_SS_DEVPASSWORD"
            exit 1
          fi
          if [ "$code" != 200 ]; then
            echo "::warning::Could not check ScreenScraper's key (HTTP $code, curl $status)"
          fi

      - name: Install zip, cmake and Task
        run: |
          set -eu
          sed -i '/bullseye-security/d' /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y --no-install-recommends zip cmake
          curl -fsSL https://taskfile.dev/install.sh | sh -s -- -b /usr/local/bin

      - name: Name the tree
        # after the release's tag: an artifact's name takes no slashes
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: echo "TREE=omega-zero-$(printf %s "$TAG" | tr / -)" >> "$GITHUB_ENV"

      - name: Build the tree
        env:
          # ScreenScraper's key for omega-zero, for the Cart Labels screen. Without it the
          # screen says the build cannot reach ScreenScraper.
          OMEGA_SS_DEVID: ${{ secrets.OMEGA_SS_DEVID }}
          OMEGA_SS_DEVPASSWORD: ${{ secrets.OMEGA_SS_DEVPASSWORD }}
        run: task dist:device OUT="$TREE"

      - name: Check what is about to ship
        run: |
          set -eu
          out="$TREE"
          file "$out/System/omega-zero" | grep -q aarch64
          # each core an aarch64 library a frontend can open: retro_init and retro_run exported
          for lib in mgba gpsp snes9x mednafen_supafaust pcsx_rearmed; do
            so="$out/System/${lib}_libretro.so"
            file "$so" | grep -q aarch64
            nm -D --defined-only "$so" | grep -qw retro_init
            nm -D --defined-only "$so" | grep -qw retro_run
          done
          test -x "$out/System/omega-zero"
          for size in 640x480 720x480 720x720; do
            test -f "$out/System/bootlogo-$size.bmp"
          done
          test -f "$out/System/probe.sh"
          test -f "$out/System/wifi.sh"
          test -f "$out/System/bluetooth.sh"
          gpsp_src_sha="$(cat vendor/gpsp-src.sha)"
          test -f "$out/System/licenses/gpsp-${gpsp_src_sha}.tar.gz"
          test -f "$out/System/licenses/gpsp-${gpsp_src_sha}.meta"
          for p in cores/gpsp/*.patch; do
            test -f "$out/System/licenses/gpsp-$(basename "$p")"
          done
          mgba_src_commit="$(grep '^commit=' vendor/mgba_libretro.so.meta | cut -d= -f2)"
          test -f "$out/System/licenses/mgba-${mgba_src_commit}.meta"
          for p in cores/mgba/*.patch; do
            test -f "$out/System/licenses/mgba-$(basename "$p")"
          done
          # Supafaust and pcsx_rearmed are GPL-2.0 as gpSP is, and Snes9x holds the LGPL-2.1
          # snes_ntsc filter: each one's source, build stamp and patches ship beside it
          for name in snes9x supafaust pcsx_rearmed; do
            src_sha="$(cat "vendor/$name-src.sha")"
            test -f "$out/System/licenses/$name-${src_sha}.tar.gz"
            test -f "$out/System/licenses/$name-${src_sha}.meta"
            grep -qx "commit=${src_sha}" "$out/System/licenses/$name-${src_sha}.meta"
            for p in cores/$name/*.patch; do
              [ -f "$p" ] || continue
              test -f "$out/System/licenses/$name-$(basename "$p")"
            done
          done
          for licence in snes9x-non-commercial snes9x-snes_ntsc-LGPL-2.1 supafaust-GPL-2.0 \
            pcsx_rearmed-GPL-2.0; do
            test -f "$out/System/licenses/$licence.txt"
          done

      - name: Package
        id: package
        run: |
          set -eu
          out="$TREE"
          zip="$out-h700.zip"
          zip -qry "$zip" "$out"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          # omega-zero on its own, with its sum, for Settings' Update on the console
          mkdir -p update
          cp "$out/System/omega-zero" update/omega-zero-aarch64
          (cd update && sha256sum omega-zero-aarch64 > omega-zero-aarch64.sha256)

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.zip }}
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: omega-zero-aarch64
          path: update/
          if-no-files-found: error

  publish:
    name: release
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.zip }}

      - uses: actions/download-artifact@v8
        with:
          name: omega-zero-aarch64

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ needs.build.outputs.zip }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -eu
          cat > notes.md <<NOTES
          For Anbernic H700 handhelds running [BaseOS](https://github.com/pvaibhav/BaseOS): made for the RG35XX SP, and also run on the RG SP. Other BaseOS devices are untested; see the [wiki](https://github.com/oauramos/omega-zero/wiki).

          Unzip and copy the contents of \`omega-zero-${TAG}/\` to the root of the card omega-zero runs from (SD1 on its own, or SD2 beside it); the [wiki](https://github.com/oauramos/omega-zero/wiki/Installing) has the steps. See the [changelog](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md).

          Emulation by mGBA (MPL-2.0) and gpSP (GPL-2.0) for the Game Boys, Snes9x (free for non-commercial use only) and Supafaust (Mednafen's snes_faust, GPL-2.0) for the SNES, and PCSX ReARMed (GPL-2.0) for the PlayStation. Their licences, patches and source (mGBA's aside) are in \`System/licenses/\`. omega-zero is free software under the GPL-3.0-or-later; its credits are in the README.
          NOTES
          cat >> notes.md <<NOTES

          Already on omega-zero? **Settings > Update** fetches this release's omega-zero on the console itself (\`omega-zero-aarch64\`, checked against \`omega-zero-aarch64.sha256\`). The cores and the card's scripts only change with the zip.
          NOTES
          # a tag that is not there yet is made at the commit this run built
          gh release create "$TAG" "$ZIP" omega-zero-aarch64 omega-zero-aarch64.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --notes-file notes.md